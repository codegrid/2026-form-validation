<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>pattern属性で書式を判定する</title>
<style>
body{font-family:sans-serif;padding:16px;line-height:1.6}
label{display:block;margin-top:12px;font-weight:bold}
fieldset label{display:inline-block;margin:0 12px 0 0;font-weight:normal}
fieldset{margin-top:12px;border:1px solid #888;border-radius:4px}
input,select{font-size:16px;padding:4px 8px;border:2px solid #888;border-radius:4px}
input[type=radio]{margin-right:4px}
button{margin-top:16px;font-size:16px;padding:6px 16px}
p{margin:4px 0;font-size:14px;color:#555}
</style>
</head>
<body>
<form action="../sent.html" method="get">
  <label for="postal-code">郵便番号</label>
  <input
    type="text"
    id="postal-code"
    name="postal-code"
    inputmode="numeric"
    autocomplete="postal-code"
    pattern="\d{3}-?\d{4}"
    title="7桁の数字で入力してください（ハイフンはあってもなくてもかまいません）"
  >
  <p>例：123-4567</p>
  <div><button type="submit">送信</button></div>
</form>
</body>
</html>
