<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>:invalidと:user-invalidの違い</title><style>body{font-family:sans-serif;padding:16px;line-height:1.6}label{display:block;margin-top:12px;font-weight:bold}input{font-size:16px;padding:4px 8px;border:2px solid #888;border-radius:4px}button{margin-top:16px;font-size:16px;padding:6px 16px}p{margin:4px 0;font-size:14px;color:#555}</style>
<style>.invalid input:invalid{border-color:red;background:#fee}.user-invalid input:user-invalid{border-color:red;background:#fee}section{margin-bottom:24px}</style></head><body>
<section class="invalid"><h2>:invalid</h2><form>
  <label for="a">メールアドレス（必須）</label>
  <input type="email" id="a" required>
  <div><button type="submit">送信</button></div>
</form></section>
<section class="user-invalid"><h2>:user-invalid</h2><form>
  <label for="b">メールアドレス（必須）</label>
  <input type="email" id="b" required>
  <div><button type="submit">送信</button></div>
</form></section>
<script>
// デモのため、実際には送信せずにメッセージを表示する
for (const form of document.querySelectorAll("form")) {
  form.addEventListener("submit", (event) => {
    if (event.defaultPrevented) return;
    event.preventDefault();
    alert("送信しました（デモのため、実際には何も送信していません）");
  });
}
</script>
</body></html>
