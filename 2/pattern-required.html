<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>書式を指定して必須にする</title>
<style>
body{font-family:sans-serif;padding:16px;line-height:1.6}
label{display:block;margin-top:12px;font-weight:bold}
fieldset label{display:inline-block;margin:0 12px 0 0;font-weight:normal}
fieldset{margin-top:12px;border:1px solid #888;border-radius:4px}
input,select{font-size:16px;padding:4px 8px;border:2px solid #888;border-radius:4px}
input[type=radio]{margin-right:4px}
button{margin-top:16px;font-size:16px;padding:6px 16px}
p{margin:4px 0;font-size:14px;color:#555}
</style>
</head>
<body>
<form action="../sent.html" method="get">
  <label for="postal-code-optional">郵便番号（pattern属性のみ）</label>
  <input type="text" id="postal-code-optional" name="postal-code-optional" pattern="\d{3}-?\d{4}">

  <label for="postal-code">郵便番号（pattern属性とrequired属性）</label>
  <input type="text" id="postal-code" name="postal-code" pattern="\d{3}-?\d{4}" required>
  <div><button type="submit">送信</button></div>
</form>
</body>
</html>
