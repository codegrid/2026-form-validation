<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>判定はブラウザ、表示は自前で行うフォーム</title><style>body{font-family:sans-serif;padding:16px;line-height:1.6}label{display:block;margin-top:12px;font-weight:bold}input{font-size:16px;padding:4px 8px;border:2px solid #888;border-radius:4px}button{margin-top:16px;font-size:16px;padding:6px 16px}p{margin:4px 0;font-size:14px;color:#555}</style>
<style>input:user-invalid{border-color:red}.error-message{color:red}</style></head><body>
<form novalidate>
  <label for="name">お名前</label>
  <input type="text" id="name" name="name" required aria-describedby="name-error">
  <p id="name-error" class="error-message"></p>

  <label for="email">メールアドレス</label>
  <input type="email" id="email" name="email" required aria-describedby="email-error">
  <p id="email-error" class="error-message"></p>

  <button type="submit">送信</button>
</form>
<script>
const form = document.querySelector("form");

form.addEventListener("submit", (event) => {
  const fields = form.querySelectorAll("input, select, textarea");

  for (const field of fields) {
    const message = document.getElementById(`${field.id}-error`);
    message.textContent = field.validationMessage;
    field.setAttribute("aria-invalid", String(!field.validity.valid));
  }

  if (!form.checkValidity()) {
    event.preventDefault();
    const firstInvalid = [...fields].find((field) => !field.validity.valid);
    firstInvalid.focus();
  }
});
</script>
<script>
// デモのため、実際には送信せずにメッセージを表示する
document.querySelector("form").addEventListener("submit", (event) => {
  if (event.defaultPrevented) return;
  event.preventDefault();
  alert("送信しました（デモのため、実際には何も送信していません）");
});
</script>
</body></html>
